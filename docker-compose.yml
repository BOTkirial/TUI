services:
  # --- conteneur des TUI (reste up, on y entre via exec) -------------
  tui:
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    # réseau de l'hôte : localhost/127.0.0.1 désignent la machine, pas le conteneur
    # (bases locales et connexions DBeaver en localhost accessibles telles quelles)
    network_mode: host
    working_dir: /work
    environment:
      HTTP_ROOT: /work/http
      HTTP_REQUESTS_DIR: /work/http/requests
      SQL_ROOT: /work/sql
    volumes:
      - ./workspace:/work
      - tui-config:/root/.config/sqltui
      # Pour importer tes vraies connexions DBeaver (lecture seule) :
      - ${HOME}/.local/share/DBeaverData:/root/.local/share/DBeaverData:ro
      # Clés et known_hosts pour les tunnels SSH du client SQL (lecture seule)
      - ${HOME}/.ssh:/root/.ssh:ro
      # docker-tui : pilote le Docker de l'hôte. ATTENTION : accès au socket =
      # accès équivalent root sur la machine, pour tout ce qui tourne ici
      - /var/run/docker.sock:/var/run/docker.sock
      # docker-tui : `compose up` relit les fichiers compose à leur chemin hôte
      # (labels des conteneurs) ; $HOME monté au même chemin, en lecture seule
      - ${HOME}:${HOME}:ro
    command: sleep infinity

volumes:
  tui-config:
